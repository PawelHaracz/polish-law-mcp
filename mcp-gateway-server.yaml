name: polish-law-mcp
# The gateway runs with --pull never, so this tag must exist on the host:
#   docker build -f Dockerfile.stdio -t polish-law-mcp:stdio .
# Or pull the published image and retag it:
#   docker pull ghcr.io/pawelharacz/polish-law-mcp:stdio
#   docker tag ghcr.io/pawelharacz/polish-law-mcp:stdio polish-law-mcp:stdio
image: polish-law-mcp:stdio
type: server
title: Polish Law
description: >-
  Complete Polish law database — Acts (Ustawy) and provisions from the Sejm ELI
  API (Dziennik Ustaw, 1918–2026) with Polish full-text search and EU
  cross-references.
metadata:
